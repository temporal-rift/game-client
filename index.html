    <meta charset="UTF-8" />

  <body>
    <div id="root"></div>
    <!-- Classic script, not type="module": must execute synchronously, before the deferred module
         bundle below, so window.__APP_CONFIG__ is already set when App.tsx reads it. In
         production, generated by the serving container's entrypoint at startup — see
         docker/render-runtime-config.sh. In local dev, copy public/config.js.example to
         public/config.js (see README.md); without it appConfig.ts treats the missing value as a
         configuration error rather than crashing. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
